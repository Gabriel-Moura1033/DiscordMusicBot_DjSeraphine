services:
  dj:
    build: .
    image: dj-bot:latest
    container_name: dj
    restart: unless-stopped
    # tini como PID 1: recolhe processos órfãos e repassa SIGTERM ao Node.
    init: true
    env_file: .env
    environment:
      # Dentro do container o painel precisa ouvir na interface da rede do container; a exposição
      # real é decidida em `ports`, que publica só no loopback do host (ADR-046).
      PANEL_HOST: 0.0.0.0
    # Painel web: NUNCA publicar em 0.0.0.0. Só esta máquina acessa (veja o teste pela LAN no README).
    ports:
      - "127.0.0.1:${PANEL_PORT:-8787}:${PANEL_PORT:-8787}"
    # /tmp em memória: o yt-dlp standalone extrai ~30 MB por execução ali; reiniciar limpa tudo.
    tmpfs:
      - /tmp:size=512m,mode=1777
    # SQLite: fila, configurações, histórico e playlists sobrevivem a restart e rebuild.
    volumes:
      - dj-data:/app/data
    mem_limit: 768m
    # Shutdown gracioso espera até 5 s pelos processos filhos; folga para fechar o gateway.
    stop_grace_period: 15s
    # Repete o HEALTHCHECK do Dockerfile (podman ignora o da imagem em formato OCI).
    healthcheck:
      test:
        - CMD-SHELL
        - 'f="$${HEARTBEAT_FILE-/tmp/dj-heartbeat}"; [ -z "$$f" ] || { [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -lt 60 ]; }'
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  dj-data:
